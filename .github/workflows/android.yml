name: Android build

on:
  push:
    branches: [ main, 'arena/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  verify:
    name: Verify debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Run lint and unit tests
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: car-service-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Signed release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CAR_SERVICE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "CAR_SERVICE_KEYSTORE_BASE64 is not configured" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/car-service-release.keystore"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Assemble signed release
        env:
          CAR_SERVICE_KEYSTORE_FILE: ${{ runner.temp }}/car-service-release.keystore
          CAR_SERVICE_KEYSTORE_PASSWORD: ${{ secrets.CAR_SERVICE_KEYSTORE_PASSWORD }}
          CAR_SERVICE_KEY_ALIAS: ${{ secrets.CAR_SERVICE_KEY_ALIAS }}
          CAR_SERVICE_KEY_PASSWORD: ${{ secrets.CAR_SERVICE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: car-service-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
